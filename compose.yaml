services:
  postgres:
    image: postgres:16-alpine
    container_name: mahaffeys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mahaffeys
      POSTGRES_USER: mahaffeys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file or the server environment}
    volumes:
      - mahaffeys-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahaffeys -d mahaffeys"]
      interval: 5s
      timeout: 5s
      retries: 12

  storage-agent:
    build:
      context: .
      dockerfile: deploy/docker/storage-agent.Dockerfile
    container_name: mahaffeys-storage-agent
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev:/dev
      - /sys:/sys:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  vision-worker:
    build:
      context: ./vision-worker
    container_name: mahaffeys-vision-worker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  mahaffeys:
    build: .
    container_name: mahaffeys-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      storage-agent:
        condition: service_healthy
      vision-worker:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NITRO_DATABASE_URL: postgresql://mahaffeys:${POSTGRES_PASSWORD}@postgres:5432/mahaffeys
      NITRO_COOKIE_SECURE: ${NITRO_COOKIE_SECURE:-false}
      NITRO_STORAGE_AGENT_URL: http://storage-agent:3010
      NITRO_VISION_WORKER_URL: http://vision-worker:8000
      NITRO_VISION_UPLOAD_DIR: /var/lib/mahaffeys/vision-images
      NITRO_VISION_RETENTION_DAYS: ${NITRO_VISION_RETENTION_DAYS:-90}
      NITRO_SCALE_SERIAL_PORT: ${SCALE_SERIAL_PORT:-/dev/ttyS4}
      NITRO_SCALE_SERIAL_BAUD_RATE: ${SCALE_SERIAL_BAUD_RATE:-2400}
    devices:
      - "/dev/ttyS4:/dev/ttyS4"
      - "/dev/ttyS5:/dev/ttyS5"
      - "/dev/ttyS6:/dev/ttyS6"
      - "/dev/ttyS7:/dev/ttyS7"
    group_add:
      - "20"
    volumes:
      - mahaffeys-vision-images:/var/lib/mahaffeys/vision-images
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  nginx:
    build:
      context: .
      dockerfile: deploy/docker/nginx.Dockerfile
    container_name: mahaffeys-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      mahaffeys:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  mahaffeys-postgres-data:
  mahaffeys-vision-images:
