services:
  postgres:
    image: postgres:16-alpine
    container_name: mahaffeys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mahaffeys
      POSTGRES_USER: mahaffeys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file or the server environment}
    volumes:
      - mahaffeys-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahaffeys -d mahaffeys"]
      interval: 5s
      timeout: 5s
      retries: 12

  mahaffeys:
    build: .
    container_name: mahaffeys-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NITRO_DATABASE_URL: postgresql://mahaffeys:${POSTGRES_PASSWORD}@postgres:5432/mahaffeys
      NITRO_COOKIE_SECURE: ${NITRO_COOKIE_SECURE:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  nginx:
    build:
      context: .
      dockerfile: deploy/docker/nginx.Dockerfile
    container_name: mahaffeys-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      mahaffeys:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  mahaffeys-postgres-data: