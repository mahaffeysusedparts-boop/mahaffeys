services:
  postgres:
    image: postgres:16-alpine
    container_name: mahaffeys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mahaffeys
      POSTGRES_USER: mahaffeys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server environment}
    volumes:
      - mahaffeys-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahaffeys -d mahaffeys"]
      interval: 5s
      timeout: 5s
      retries: 12

  mahaffeys:
    build: .
    container_name: mahaffeys
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NITRO_DATABASE_URL: postgresql://mahaffeys:${POSTGRES_PASSWORD}@postgres:5432/mahaffeys
      NITRO_COOKIE_SECURE: ${NITRO_COOKIE_SECURE:-false}
    ports:
      - "3000:3000"

volumes:
  mahaffeys-postgres-data:
