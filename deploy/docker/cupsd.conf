Listen /var/run/cups/cups.sock
DefaultAuthType Basic
WebInterface No
SystemGroup lpadmin
<Location />
  Order allow,deny
  Allow from 127.0.0.1
  Allow from ::1
</Location>
<Location /admin>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow from 127.0.0.1
  Allow from ::1
</Location>
<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow from 127.0.0.1
  Allow from ::1
</Location>
